    <!-- Each theme's ground and text, painted before the stylesheets load so the first frame is
         not the wrong colour. :where() gives them no weight, so the theme tokens win once the
         stylesheet is in. No stylesheet is loaded yet, so a custom property cannot be read and
         the values are literals, the one copy of the palette outside style/.
         scripts/check/contracts.mjs fails when the two disagree. The first line sets the order of
         every stylesheet's cascade layer before any stylesheet loads (style/main.css), and
         these rules sit in the lowest layer, so every stylesheet wins over them. -->
    <style>
      @layer tokens, base, maths, shell, study, unit;
      @layer tokens {
        html,
        body {
          margin: 0;
        }
        :where(html[data-theme='dark'], html[data-theme='dark'] body) {
          background: #121110;
          color: #ece9e1;
        }
        :where(html[data-theme='light'], html[data-theme='light'] body) {
          background: #f7f5f0;
          color: #1c1a17;
        }
        :where(html[data-theme='dark'][data-contrast='more'], html[data-theme='dark'][data-contrast='more'] body) {
          background: #000000;
          color: #ffffff;
        }
        :where(html[data-theme='light'][data-contrast='more'], html[data-theme='light'][data-contrast='more'] body) {
          background: #ffffff;
          color: #000000;
        }
      }
    </style>

    <!-- Sets the theme, its contrast and the browser bar's colour before the first paint -->
    <script>
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('aether-theme')
        } catch (e) {}
        var m = /^(dark|light)(-more)?$/.exec(t || '')
        var root = document.documentElement
        root.setAttribute(
          'data-theme',
          m ? m[1] : window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        )
        if ((m && m[2]) || window.matchMedia('(prefers-contrast: more)').matches) {
          root.setAttribute('data-contrast', 'more')
        }
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', getComputedStyle(root).backgroundColor)
      })()
    </script>
