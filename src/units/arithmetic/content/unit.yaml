# The unit's manifest. Built on the Mathematics division of "A Self-Study System":
# every topic runs its four steps, and the paper names the three sources below.
# The paper rules out capstones, unit tests and cards, so capstone, mastery_gate
# and coverage_audit are gone.

slug: explore/mathematics/arithmetic
discipline: Mathematics
title: Arithmetic
prerequisites: []

canon_sources:
  - author: Hung-Hsi Wu
    work: Understanding Numbers in Elementary School Mathematics
    publisher: American Mathematical Society
    year: 2011
    feeds: steps 1 and 2 (worked examples, problem bank), with his corrections list and posted Activity solutions
  - author: Edmund Landau
    work: Foundations of Analysis
    chapters: 1-2 (Theorems 1-115)
    feeds: step 3 (proofs to read)
  - author: Kevin Buzzard and Jon Eugster
    work: Natural Number Game
    feeds: step 4 (statements to prove)

# Prerequisite order. Number Facts and Mixed Practice are the number-facts gate and step 2;
# the facts come first, as in the paper's "Running it" chart and the registry's pager order.
