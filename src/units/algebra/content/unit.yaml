# The unit's manifest. Built on Mathematics, "The second
# stage": algebra runs arithmetic's four steps and gates, adds Find the error and Translate to
# every topic before the olympiad topics, and allows no calculator. Step 4's statements come from
# Mathlib, and for the olympiad topics from miniF2F and Compfiles, each proved on paper.

slug: explore/mathematics/algebra
discipline: Mathematics
title: Algebra

canon_sources:
  - author: Richard Rusczyk
    work: Introduction to Algebra
    feeds: steps 1 to 3 (problems before text, worked examples, exercises and review problems, proofs)
  - author: Richard Rusczyk and Mathew Crawford
    work: Intermediate Algebra
    feeds: steps 1 to 3 (problems before text, worked examples, exercises and review problems, proofs)
  - author: Titu Andreescu, Navid Safaei and Alessandro Ventullo
    work: Awesome Polynomials for Mathematics Competitions
    feeds: steps 1 to 3 for Polynomials (theory, problems with full solutions, proofs)
  - author: Pham Kim Hung
    work: Secrets in Inequalities, Volumes 1 and 2
    feeds: steps 1 to 3 for Inequalities (theory, problems with full solutions, proofs)
  - author: Titu Andreescu, Iurie Boreico, Oleg Mushkarov and Nikolai Nikolov
    work: Topics in Functional Equations
    feeds: steps 1 to 3 for Functional equations (theory, problems with full solutions, proofs)
  - author: Arthur Engel
    work: Problem-Solving Strategies
    feeds: steps 1 to 3 for Sequences and series, chapter 9 (theory, problems with full solutions, proofs)

# The pages done every session: the number-facts gate (Arithmetic's page and record) and step 2.
pages:
  - number-facts
  - mixed-practice

